<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SalQuino FitGym</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon" style="background:linear-gradient(135deg,#ef4444,#dc2626);"><i class="fas fa-shield-alt"></i></div>
            <h2>Admin Access</h2>
            <p>Authorized personnel only</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-msg flash-{{ category }}">
                    {{ message }}
                    <button type="button" class="flash-close" onclick="this.closest('.flash-msg').remove()" aria-label="Close">&times;</button>
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/admin-login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Admin username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="adminPwd" placeholder="Admin password" required>
                <i class="fas fa-eye-slash password-toggle" id="toggleAdminPwd"></i>
            </div>
            <button type="submit" class="btn-submit" style="background:linear-gradient(135deg,#ef4444,#dc2626);">
                <i class="fas fa-lock"></i> Admin Login
            </button>
        </form>

        <div class="auth-footer">
            <p><a href="/login"><i class="fas fa-arrow-left"></i> Back to Member Login</a></p>
        </div>
    </div>

    <script>
        document.getElementById('toggleAdminPwd').addEventListener('click', function() {
            const p = document.getElementById('adminPwd');
            p.type = p.type === 'password' ? 'text' : 'password';
            this.classList.toggle('fa-eye-slash'); this.classList.toggle('fa-eye');
        });

        // Auto-dismiss flash messages after 3 seconds
        document.querySelectorAll('.flash-msg').forEach(msg => {
            setTimeout(() => {
                msg.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                msg.style.opacity = '0';
                msg.style.transform = 'translateY(-10px)';
                setTimeout(() => msg.remove(), 500);
            }, 3000);
        });
    </script>
    <script src="/static/script.js"></script>
</body>
</html>
