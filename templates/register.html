<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SalQuino FitGym</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon"><i class="fas fa-dumbbell"></i></div>
            <h2>Create Account</h2>
            <p>Join SalQuino FitGym and start your fitness journey</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-msg flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/register" id="registerForm">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" placeholder="First Name" value="{{ first_name or '' }}" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" placeholder="Last Name" value="{{ last_name or '' }}" required>
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="" disabled {% if not gender %}selected{% endif %}>Select Gender</option>
                    <option value="Male" {% if gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Email Address" value="{{ email or '' }}" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" id="phone" placeholder="09XXXXXXXXX" value="{{ phone or '' }}" maxlength="11" required>
                <small style="color:#64748b;font-size:11px;margin-top:4px;display:block;">11-digit phone number</small>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="password" placeholder="Min 6 characters" required minlength="6">
                <i class="fas fa-eye-slash password-toggle" id="togglePassword"></i>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" id="confirmPassword" placeholder="Confirm password" required>
                <i class="fas fa-eye-slash password-toggle" id="toggleConfirm"></i>
            </div>
            <button type="submit" class="btn-submit">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/login">Login here</a></p>
        </div>
    </div>

    <script>
        // Phone validation
        const phone = document.getElementById('phone');
        phone.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Password toggles
        document.getElementById('togglePassword').addEventListener('click', function() {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
            this.classList.toggle('fa-eye-slash'); this.classList.toggle('fa-eye');
        });
        document.getElementById('toggleConfirm').addEventListener('click', function() {
            const p = document.getElementById('confirmPassword');
            p.type = p.type === 'password' ? 'text' : 'password';
            this.classList.toggle('fa-eye-slash'); this.classList.toggle('fa-eye');
        });

        // Email lowercase on submit
        document.getElementById('registerForm').addEventListener('submit', function() {
            const e = document.querySelector("input[name='email']");
            e.value = e.value.trim().toLowerCase();
        });
    </script>
</body>
</html>
