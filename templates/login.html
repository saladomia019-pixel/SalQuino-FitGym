<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SalQuino FitGym</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page" style="padding-top:80px;">

    <!-- NAVIGATION HEADER -->
    <nav class="landing-nav">
        <a href="/" class="logo"><i class="fas fa-dumbbell"></i> SalQuino FitGym</a>
        <div class="nav-links">
            <a href="/login" style="color:#3b82f6;font-weight:600;">Login</a>
            <a href="/register" class="btn-primary" style="padding:10px 24px;font-size:14px;">Register</a>
        </div>
    </nav>

    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon"><i class="fas fa-dumbbell"></i></div>
            <h2>Welcome</h2>
            <p>Login to your SalQuino FitGym account</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-msg flash-{{ category }}">
                    {{ message }}
                    <button type="button" class="flash-close" onclick="this.closest('.flash-msg').remove()" aria-label="Close">&times;</button>
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password" required>
                <i class="fas fa-eye-slash password-toggle" id="togglePassword"></i>
            </div>
            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="/register">Create Account</a></p>
            <p style="margin-top:16px;"><a href="/admin-login" style="color:#64748b;font-weight:500;font-size:13px;"><i class="fas fa-shield-alt"></i> Admin Login</a></p>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('togglePassword');
        const pwd = document.getElementById('password');
        toggle.addEventListener('click', function() {
            const type = pwd.type === 'password' ? 'text' : 'password';
            pwd.type = type;
            this.classList.toggle('fa-eye-slash');
            this.classList.toggle('fa-eye');
        });
    </script>
</body>
</html>
